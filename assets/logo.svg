<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"  stop-color="#0d1117"/>
      <stop offset="1"  stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1"   stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#9aa7b4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="1194" height="354" rx="18" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- paginated paper stack (discovery / feed) -->
  <g transform="translate(120,86)">
    <rect x="38" y="34" width="150" height="196" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <rect x="19" y="17" width="150" height="196" rx="10" fill="#2d333b" stroke="#30363d" stroke-width="2"/>
    <rect x="0"  y="0"  width="150" height="196" rx="10" fill="url(#paper)"/>
    <!-- arXiv-ish id + text lines -->
    <text x="18" y="36" font-size="20" font-weight="700" fill="#cf222e" font-family="monospace">arXiv</text>
    <g fill="#57606a">
      <rect x="18" y="58" width="114" height="9" rx="4"/>
      <rect x="18" y="78" width="96"  height="9" rx="4"/>
      <rect x="18" y="98" width="114" height="9" rx="4"/>
      <rect x="18" y="118" width="80" height="9" rx="4"/>
      <rect x="18" y="146" width="114" height="9" rx="4"/>
      <rect x="18" y="166" width="104" height="9" rx="4"/>
    </g>
  </g>

  <!-- flow arrow: discover -> download -->
  <g filter="url(#glow)">
    <path d="M312 184 H452" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M452 184 l-24 -16 v32 z" fill="#3fb950"/>
  </g>
  <text x="318" y="150" font-size="20" fill="#8b949e" font-family="monospace">discover · stream</text>

  <!-- download tray (PDF out) -->
  <g transform="translate(486,96)">
    <path d="M40 0 v96" stroke="#3fb950" stroke-width="10" stroke-linecap="round"/>
    <path d="M40 96 l-26 -28 h52 z" fill="#3fb950"/>
    <rect x="-10" y="118" width="100" height="14" rx="7" fill="#3fb950"/>
    <text x="-2" y="172" font-size="30" font-weight="800" fill="#f0f6fc" font-family="monospace">PDF</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(660,150)">
    <text x="0" y="0" font-size="76" font-weight="800" font-family="monospace" fill="#f0f6fc">alphaxiv<tspan fill="#58a6ff">-</tspan><tspan fill="url(#accent)">dl</tspan></text>
    <text x="2" y="46" font-size="25" fill="#8b949e">polite arXiv PDF harvester · Nim</text>
    <text x="2" y="84" font-size="18" fill="#6e7681" font-family="monospace">alphaXiv discovery → export.arxiv.org · rate-limited · resumable</text>
  </g>
</svg>
